<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Area Map Viewer</title>
    <!-- Load the smooth zooming library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        #map-container {
            width: 100vw;
            height: 100vh;
        }
        #map-object {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <!-- Securely loads your SVG via your GitHub Pages web server -->
        <object id="map-object" type="image/svg+xml" data="Current Map - Metro Area.svg"></object>
    </div>

    <script>
        window.onload = function() {
            const svgObject = document.getElementById('map-object');
            
            svgObject.addEventListener('load', function() {
                // Initialize the zoom engine on the loaded file
                svgPanZoom('#map-object', {
                    zoomEnabled: true,
                    panEnabled: true,
                    controlIconsEnabled: true, 
                    fit: true,
                    center: true,
                    minZoom: 0.1,
                    maxZoom: 100, 
                    zoomScaleSensitivity: 0.2
                });
            });
        };
    </script>
</body>
</html>
